# NGINX als HTTPS-Reverse-Proxy vor Wayon.
#
# Wayon selbst lauscht nur lokal auf 127.0.0.1:8080 (siehe deploy/wayon.service).
# "suche.example.de" durch die eigene Domain ersetzen – das erledigt
# deploy/setup-https.sh automatisch.
#
# Kompatibel mit nginx ab 1.18 (Debian 11/12, Ubuntu 22.04/24.04).

# Anfragebegrenzung pro IP (schützt vor Überlastung durch Bots).
limit_req_zone $binary_remote_addr zone=wayon_search:10m  rate=5r/s;
limit_req_zone $binary_remote_addr zone=wayon_suggest:10m rate=20r/s;
limit_req_status 429;

upstream wayon_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP: nur Let's-Encrypt-Prüfung und Weiterleitung auf HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name suche.example.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name suche.example.de;

    # --- TLS (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/suche.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suche.example.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:WayonTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Sicherheits-Header ---
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Wayon liefert CSS und JS inline aus, daher 'unsafe-inline'
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    server_tokens off;
    client_max_body_size 16k;   # Wayon nimmt nur GET-Anfragen entgegen

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/opensearchdescription+xml text/css application/javascript;

    # Gemeinsame Proxy-Einstellungen
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Autovervollständigung: viele kleine Anfragen beim Tippen
    location = /api/suggest {
        limit_req zone=wayon_suggest burst=40 nodelay;
        proxy_pass http://wayon_backend;
    }

    location = /opensearch.xml {
        proxy_pass http://wayon_backend;
        expires 1d;
    }

    location / {
        limit_req zone=wayon_search burst=20 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://wayon_backend;
    }
}
